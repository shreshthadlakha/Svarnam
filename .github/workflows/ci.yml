name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install pandas openpyxl lxml pytest pillow
      - name: Parser fixtures + invariants
        run: python -m pytest pipeline/tests -q
      - name: A7 advice-language gate (tag-stripped site copy)
        run: python pipeline/blocklist_check.py
